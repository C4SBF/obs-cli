[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obs-cli"
version = "0.1.0"
description = "CLI tool for BACnet network discovery"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "openbuildingstack @ git+https://github.com/C4SBF/obs-python.git",
]

[project.scripts]
obs = "obs_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/obs_cli"]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
